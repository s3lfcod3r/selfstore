name: Katalog Auto-Sync

on:
  workflow_dispatch: {}
  # Von einem App-Repo per repository_dispatch (Event "app-released") auslösbar —
  # dafür braucht das App-Repo ein PAT-Secret mit actions:write auf dieses Repo.
  repository_dispatch:
    types: [app-released]
  release:
    types: [published]   # eigenes SelfStore-Release löst den Sync direkt aus
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (Sync lädt nur bei echter Änderung)

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Immer main auschecken — bei release-Triggern wäre es sonst der Tag
      # (detached HEAD) und der spätere git push würde fehlschlagen.
      # Actions auf Commit-SHA gepinnt (nicht auf Tag): ein umgehaengter Tag
      # koennte sonst fremden Code in einen Job mit Schreibrechten bringen,
      # der catalog.json UND selfstore.apk veroeffentlicht. Kommentar = Tag,
      # damit man beim Aktualisieren sieht, welche Version gemeint war.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Feste Versionen inkl. aller Transitiven + --require-hashes: pip
      # installiert nur exakt diese Artefakte. Aktualisieren via
      # tools/requirements.txt (Kommentar dort erklaert das Vorgehen).
      - name: Abhängigkeiten
        run: pip install --quiet --require-hashes -r tools/requirements.txt

      - name: Katalog synchronisieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_DATE: ${{ github.run_id }}
        run: |
          export SYNC_DATE="$(date -u +%F)"
          python tools/sync_catalog.py

      # Waechter: kaputte Kodierung, ungueltiges JSON oder fehlende Pflichtfelder
      # duerfen nicht veroeffentlicht werden — dann bricht der Job ab und der
      # letzte gute Katalog bleibt stehen.
      - name: Katalog pruefen
        run: node tools/check_catalog.js

      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "s3lfcod3r"
            git config user.email "info@selfcoder.de"
            git add -A
            git commit -m "chore: Katalog Auto-Sync (Release-Versionen + Bootstrap-APK)"
            git push
          else
            echo "Keine Änderungen am Katalog."
          fi
